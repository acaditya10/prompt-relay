<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>opencode notify</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔔</text></svg>">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="header">
      <div class="header-left">
        <div class="logo">⚡</div>
        <h1>opencode<span>notify</span></h1>
      </div>
      <div id="status-badge" class="status disconnected">
        <span class="status-dot"></span>
        <span class="status-text">Disconnected</span>
      </div>
    </header>

    <!-- Connection Info -->
    <div id="connection-bar" class="connection-bar hidden">
      <span>Connecting to server...</span>
      <span id="server-url"></span>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="empty-state">
      <div class="empty-icon">📭</div>
      <h2>No pending requests</h2>
      <p>When opencode needs your input, a prompt will appear here.</p>
      <p class="hint">Keep this page open or add it to your home screen.</p>
    </div>

    <!-- Prompt Queue -->
    <div id="prompt-queue" class="prompt-queue"></div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
